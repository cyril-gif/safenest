<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#070b18"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>SafeNest - Family Location</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  
  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- CryptoJS for Password Hashing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    :root {
      --bg: #070b18; --bg-card: #0d1225; --border: #1e2d4a;
      --accent: #3b82f6; --green: #10b981; --amber: #f59e0b; --red: #ef4444;
      --text: #f1f5f9; --muted: #94a3b8; --font: 'Syne', sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
    #root { height: 100%; display: flex; flex-direction: column; }
    
    /* Layout & Cards */
    .page { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
    .card-sm { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    
    /* Inputs & Buttons */
    .input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: white; margin-bottom: 14px; font-family: var(--font); font-size: 14px; }
    .input:focus { border-color: var(--accent); outline: none; }
    .label { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #06b6d4); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; }
    
    /* Nav */
    .nav { display: flex; background: var(--bg-card); border-top: 1px solid var(--border); flex-shrink: 0; }
    .nav-btn { flex: 1; padding: 16px; text-align: center; color: var(--muted); font-weight: 700; font-size: 12px; cursor: pointer; border: none; background: none; transition: 0.2s; }
    .nav-btn.active { color: var(--accent); }
    
    /* Map */
    #map { width: 100%; height: 100%; z-index: 1; }
    .leaflet-container { background: var(--bg) !important; }
    .leaflet-tile { filter: brightness(0.8) saturate(0.7) hue-rotate(200deg); }
    
    /* Utilities */
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.offline { background: var(--muted); }
  </style>
</head>
<body>
<div id="root"></div>

<!-- React & Babel (Required for no-build GitHub setup) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ── CONFIGURATION ─────────────────────────────────────────────────────────────
const CONFIG = {
  FIREBASE_URL: "https://lantam-cyril-default-rtdb.firebaseio.com",
  CARTO_API_KEY: "YOUR_CARTO_API_KEY_HERE" // 👈 PASTE YOUR CART API KEY HERE
};

// ── Firebase API ──────────────────────────────────────────────────────────────
const fbGet = async (p) => { try { const r = await fetch(`${CONFIG.FIREBASE_URL}/${p}.json`); return r.ok ? r.json() : null; } catch { return null; } };
const fbSet = async (p, d) => { try { await fetch(`${CONFIG.FIREBASE_URL}/${p}.json`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(d) }); } catch {} };
const fbPatch = async (p, d) => { try { await fetch(`${CONFIG.FIREBASE_URL}/${p}.json`, { method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(d) }); } catch {} };

// ── Security & Helpers ────────────────────────────────────────────────────────
const hashPass = (pass) => CryptoJS.SHA256(pass).toString();
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,16);
const LS = {
  get: (k) => { try { return JSON.parse(localStorage.getItem("sn_"+k)); } catch { return null; } },
  set: (k,v) => { try { localStorage.setItem("sn_"+k, JSON.stringify(v)); } catch {} },
  del: (k) => { try { localStorage.removeItem("sn_"+k); } catch {} },
};

// ── Map Component ─────────────────────────────────────────────────────────────
function MapView({ members }) {
  const mapRef = useRef(null);
  const markersRef = useRef({});

  useEffect(() => {
    if (!mapRef.current) {
      mapRef.current = L.map('map', { zoomControl: false }).setView([9.0, -2.5], 6);
      L.tileLayer(`https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?apiKey=${CONFIG.CARTO_API_KEY}`, { maxZoom: 19 }).addTo(mapRef.current);
      L.control.zoom({ position: 'bottomright' }).addTo(mapRef.current);
    }

    const map = mapRef.current;
    Object.values(markersRef.current).forEach(m => map.removeLayer(m));
    markersRef.current = {};

    const online = members.filter(m => m.online && m.lat);
    online.forEach(m => {
      const color = m.role === 'father' ? '#f59e0b' : '#3b82f6';
      const icon = L.divIcon({
        html: `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 0 15px ${color};"></div>`,
        className: '', iconSize: [18, 18], iconAnchor: [9, 9]
      });
      markersRef.current[m.role] = L.marker([m.lat, m.lng], { icon }).addTo(map);
    });

    if (online.length > 0) {
      const bounds = online.map(m => [m.lat, m.lng]);
      map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15 });
    }
  }, [members]);

  return <div id="map" style={{ flex: 1 }} />;
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({ onLogin }) {
  const [isLogin, setIsLogin] = useState(true);
  const [form, setForm] = useState({ name: '', code: '', pass: '', role: 'father' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.name || !form.code || form.pass.length < 4) { setError("Fill all fields (Pass 4+ chars)."); return; }
    setError(''); setLoading(true);
    
    const room = slug(form.code);
    const hashedPass = hashPass(form.pass);
    let users = await fbGet(`rooms/${room}/users`) || {};

    if (isLogin) {
      const user = Object.values(users).find(u => u.name === form.name && u.pass === hashedPass);
      if (!user) { setError('Invalid name or password.'); setLoading(false); return; }
      const sess = { name: user.name, role: user.role, room };
      LS.set('sess', sess); onLogin(sess);
    } else {
      if (Object.values(users).find(u => u.role === form.role)) {
        setError(`A ${form.role} is already in this room.`); setLoading(false); return;
      }
      const newUser = { name: form.name, role: form.role, pass: hashedPass };
      users[form.name] = newUser;
      await fbSet(`rooms/${room}/users`, users);
      const sess = { name: newUser.name, role: newUser.role, room };
      LS.set('sess', sess); onLogin(sess);
    }
    setLoading(false);
  };

  return (
    <div className="center">
      <div className="card">
        <h2 style={{ textAlign: 'center', marginBottom: '8px', color: 'var(--accent)' }}>🛡️ SafeNest</h2>
        <p style={{ textAlign: 'center', fontSize: '11px', color: 'var(--muted)', marginBottom: '24px', letterSpacing: '1px' }}>FAMILY LOCATION SHARING</p>
        
        <div style={{ display: 'flex', gap: '10px', marginBottom: '20px' }}>
          <button onClick={() => setIsLogin(true)} style={{ flex: 1, padding: '10px', background: isLogin ? 'var(--accent)' : 'transparent', color: 'white', border: '1px solid var(--accent)', borderRadius: '8px', cursor: 'pointer', fontWeight: '700' }}>Log In</button>
          <button onClick={() => setIsLogin(false)} style={{ flex: 1, padding: '10px', background: !isLogin ? 'var(--accent)' : 'transparent', color: 'white', border: '1px solid var(--accent)', borderRadius: '8px', cursor: 'pointer', fontWeight: '700' }}>Register</button>
        </div>

        <form onSubmit={handleSubmit}>
          {!isLogin && (
            <>
              <label className="label">I am the</label>
              <select className="input" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="father">Father 👨</option>
                <option value="son">Son 👦</option>
              </select>
            </>
          )}
          
          <label className="label">Family Code</label>
          <input className="input" placeholder="e.g. smithfamily" value={form.code} onChange={e => setForm({...form, code: e.target.value})} />
          
          <label className="label">Your Name</label>
          <input className="input" placeholder="Enter name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
          
          <label className="label">Password</label>
          <input className="input" type="password" placeholder="Min 4 characters" value={form.pass} onChange={e => setForm({...form, pass: e.target.value})} />

          {error && <div style={{ color: 'var(--red)', fontSize: '12px', marginBottom: '14px', textAlign: 'center' }}>{error}</div>}
          
          <button className="btn" type="submit" disabled={loading}>
            {loading ? 'Please wait...' : isLogin ? 'Log In' : 'Create Account'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({ session, onLogout }) {
  const [tab, setTab] = useState('map');
  const [members, setMembers] = useState([]);
  const [sharing, setSharing] = useState(false);
  const watchRef = useRef(null);

  useEffect(() => {
    const poll = async () => {
      const users = await fbGet(`rooms/${session.room}/users`) || {};
      const locs = await fbGet(`rooms/${session.room}/locations`) || {};
      
      const list = Object.entries(users).map(([name, u]) => {
        const loc = locs[u.role] || {};
        const isStale = Date.now() - (loc.t || 0) > 15000;
        return {
          name, role: u.role,
          lat: loc.lat, lng: loc.lng,
          online: loc.online && !isStale
        };
      });
      setMembers(list);
    };
    poll();
    const interval = setInterval(poll, 3000);
    return () => clearInterval(interval);
  }, [session.room]);

  const toggleSharing = () => {
    if (sharing) {
      if (watchRef.current) navigator.geolocation.clearWatch(watchRef.current);
      fbPatch(`rooms/${session.room}/locations`, { [session.role]: { online: false, t: Date.now() } });
      setSharing(false);
    } else {
      if (!navigator.geolocation) return alert('GPS not supported.');
      setSharing(true);
      watchRef.current = navigator.geolocation.watchPosition(
        (pos) => {
          fbPatch(`rooms/${session.room}/locations`, {
            [session.role]: { online: true, lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() }
          });
        },
        (err) => alert('GPS Error: ' + err.message),
        { enableHighAccuracy: true }
      );
    }
  };

  return (
    <div className="page">
      <div style={{ padding: '16px', background: 'var(--bg-card)', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', zIndex: 10 }}>
        <div>
          <div style={{ fontWeight: 800, fontSize: '18px' }}>SafeNest</div>
          <div style={{ fontSize: '11px', color: 'var(--muted)', fontFamily: 'var(--mono)' }}>Room: {session.room}</div>
        </div>
        <button onClick={onLogout} className="btn-ghost">Log Out</button>
      </div>

      {tab === 'map' ? (
        <MapView members={members} />
      ) : (
        <div className="center" style={{ alignItems: 'flex-start' }}>
          <div style={{ width: '100%', maxWidth: '400px' }}>
            <h3 style={{ marginBottom: '16px' }}>Family Members</h3>
            {members.map(m => (
              <div key={m.role} className="card-sm flex-between" style={{ marginBottom: '10px' }}>
                <span style={{ fontWeight: 700 }}>{m.name} <span style={{ color: 'var(--muted)', fontSize: '11px' }}>({m.role})</span></span>
                <span style={{ color: m.online ? 'var(--green)' : 'var(--muted)', fontSize: '12px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <span className={`dot ${m.online ? 'online' : 'offline'}`}></span> {m.online ? 'LIVE' : 'OFFLINE'}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab === 'map' && (
        <button onClick={toggleSharing} className="btn" style={{
            position: 'absolute', bottom: '100px', left: '50%', transform: 'translateX(-50%)',
            width: '80px', height: '80px', borderRadius: '50%', padding: 0,
            background: sharing ? 'var(--green)' : 'var(--bg-card)',
            border: `4px solid ${sharing ? 'white' : 'var(--border)'}`,
            fontSize: '28px', zIndex: 1000, boxShadow: sharing ? '0 0 30px var(--green)' : 'none',
            display: 'flex', alignItems: 'center', justifyContent: 'center'
          }}>
          {sharing ? '📡' : '📴'}
        </button>
      )}

      <div className="nav">
        <button className={`nav-btn ${tab === 'map' ? 'active' : ''}`} onClick={() => setTab('map')}>🗺️ Map</button>
        <button className={`nav-btn ${tab === 'family' ? 'active' : ''}`} onClick={() => setTab('family')}>👨‍👩‍👦 Family</button>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  const [sess, setSess] = useState(() => LS.get('sess'));
  const login = (s) => setSess(s);
  const logout = () => { LS.del('sess'); setSess(null); };
  if (!sess) return <AuthScreen onLogin={login} />;
  return <Dashboard session={sess} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
